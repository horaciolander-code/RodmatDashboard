name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-syntax:
    name: Backend — Python syntax check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check syntax of ALL .py files
        run: |
          cd backend
          python -m compileall -q app
      # `compileall` solo mira la sintaxis: un nombre que no existe compila
      # perfectamente y revienta en ejecucion. El 19-oct-2026 un cambio dejo
      # `data_lag_days` usada pero sin definir en el informe diario, y el
      # email estuvo SIETE DIAS sin salir — en report_logs solo se veia
      # "failed", sin decir por que. Esto lo habria cazado en el acto.
      - name: Nombres indefinidos (el fallo que compila y revienta)
        run: |
          pip install -q pyflakes
          echo "--- backend ---"
          python -m pyflakes backend/app | grep "undefined name" && exit 1 || true
          echo "--- dashboard ---"
          python -m pyflakes dashboard | grep "undefined name" && exit 1 || true
          echo "sin nombres indefinidos"
      - name: Verify routers import individually (sin DB)
        run: |
          cd backend
          # Each router file should at minimum be importable as a module syntactically
          python -c "
          import os, sys, importlib.util, pathlib
          api_dir = pathlib.Path('app/api')
          fail = []
          for f in sorted(api_dir.glob('*.py')):
              if f.name == '__init__.py': continue
              spec = importlib.util.spec_from_file_location(f.stem, f)
              try:
                  # Solo parsea, no ejecuta (importlib parsea al __init__)
                  source = f.read_text()
                  compile(source, str(f), 'exec')
                  print(f'  ✓ {f.name}')
              except Exception as e:
                  fail.append((f.name, str(e)))
                  print(f'  ✗ {f.name}: {e}')
          if fail:
              sys.exit(1)
          print(f'\nAll {len(list(api_dir.glob(\"*.py\")))-1} routers syntactically valid')
          "

  brand-isolation:
    name: Aislamiento multi-tenant / multi-marca
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # pandas: lo necesitan test_fuga_devoluciones.py y test_temu_import.py, que
      # trabajan con DataFrames sintéticos. Acotado por major: este job bloquea
      # el merge, y un pandas 4 rompería la puerta por algo ajeno al código.
      - run: pip install pytest "pandas>=2.0.0,<4.0"
      - name: Cada bug de marca que llego a produccion tiene aqui su test
        run: |
          cd backend
          python -m pytest tests/ -q

  frontend-build:
    name: Frontend — vite build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: cd frontend/setup-panel && npm ci
      - run: cd frontend/setup-panel && npm run build
      # El navegador no ejecuta el codigo fuente: ejecuta el bundle commiteado
      # en backend/static/, que se genera a mano con `npm run build` y se copia.
      # El 11-oct TEMU se mergeo con los tres checks en verde y el panel
      # desplegado siguio sin el paso: este job compilaba y tiraba el resultado.
      - name: El panel compilado no se queda atras del codigo fuente
        if: github.event_name == 'pull_request'
        run: |
          base="origin/${{ github.base_ref }}"
          git fetch -q origin "${{ github.base_ref }}"
          cambios=$(git diff --name-only "$base...HEAD")
          fuente=$(echo "$cambios" | grep -cE '^frontend/setup-panel/(src/|index\.html|package(-lock)?\.json)' || true)
          build=$(echo "$cambios" | grep -cE '^backend/static/' || true)
          echo "ficheros de fuente del panel tocados: $fuente"
          echo "ficheros de backend/static tocados:   $build"
          if [ "$fuente" -gt 0 ] && [ "$build" -eq 0 ]; then
            echo
            echo "Este PR cambia el panel pero no el bundle que sirve produccion."
            echo "Sin recompilar, el cambio NO llega al navegador."
            echo
            echo "  cd frontend/setup-panel && npm ci && npm run build"
            echo "  rm -f ../../backend/static/assets/*.js ../../backend/static/assets/*.css"
            echo "  cp -r dist/. ../../backend/static/"
            echo
            exit 1
          fi

